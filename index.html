<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahorro en pareja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C0A;
    --surface:#17190F;
    --ink:#EDEFE7;
    --muted:#93A092;
    --line:#2B2E27;
    --teal:#4FAE9C;
    --teal-soft:#173733;
    --brick:#D08A6C;
    --brick-soft:#3A2620;
    --gold:#D9AE5A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,4vw,38px);
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  .subhead{
    color:var(--muted);
    font-size:14.5px;
    margin:0;
  }
  .status-line{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 22px 0;
  }
  .status-line.error{color:var(--brick);}
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
  }
  .icon-btn{
    background:transparent;
    color:var(--muted);
    font-size:13.5px;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    white-space:nowrap;
  }
  .icon-btn:hover{background:var(--surface);border-color:var(--teal);color:var(--teal);}

  .grid{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:22px;
  }
  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
  }

  /* --- Resumen --- */
  .hero-total{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(38px,7vw,52px);
    line-height:1;
    margin:2px 0 2px 0;
  }
  .hero-label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:2px;
  }
  .goal-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:4px;
    font-size:13.5px;
    color:var(--muted);
  }
  .goal-line strong{color:var(--ink);font-weight:600;}
  .track{
    position:relative;
    height:10px;
    background:var(--bg);
    border-radius:999px;
    margin:10px 0 18px 0;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .track-fill{
    position:absolute;top:0;left:0;bottom:0;
    background:linear-gradient(90deg,var(--teal),var(--gold));
    border-radius:999px;
    transition:width .5s ease;
  }
  .persons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:6px;
  }
  .person-card{
    border-radius:11px;
    padding:12px 13px;
    border:1px solid var(--line);
  }
  .person-card.p1{background:var(--teal-soft);}
  .person-card.p2{background:var(--brick-soft);}
  .person-name{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:3px;
    display:flex;align-items:center;gap:6px;
  }
  .person-avatar{
    width:45px;height:45px;
    border-radius:50%;
    object-fit:cover;
    flex:0 0 auto;
    border:1.5px solid var(--line);
  }
  .person-avatar-fallback{
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    color:var(--ink);
  }
  .person-avatar.p1, .person-avatar-fallback.p1{border-color:var(--teal);}
  .person-avatar.p2, .person-avatar-fallback.p2{border-color:var(--brick);}
  .person-avatar-fallback.p1{background:var(--teal-soft);}
  .person-avatar-fallback.p2{background:var(--brick-soft);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot.p1{background:var(--teal);}
  .dot.p2{background:var(--brick);}
  .person-amount{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
  }
  .person-goal-line{
    font-size:11.5px;
    color:var(--muted);
    margin-top:6px;
  }
  .mini-track{
    position:relative;
    height:6px;
    background:var(--bg);
    border-radius:999px;
    margin-top:5px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .mini-track-fill{
    position:absolute;top:0;left:0;bottom:0;
    border-radius:999px;
    transition:width .5s ease;
  }
  .mini-track-fill.p1{background:var(--teal);}
  .mini-track-fill.p2{background:var(--brick);}

  .settings-toggle{
    margin-top:18px;
    text-align:left;
  }
  .settings-toggle button{
    background:none;color:var(--muted);font-size:12.5px;
    text-decoration:underline;text-decoration-color:var(--line);
    padding:0;
  }
  .settings-panel{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:none;
  }
  .settings-panel.open{display:block;}
  .person-settings-block{
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .person-settings-block:last-of-type{border-bottom:none;}
  .avatar-field{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .goals-field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .goal-chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .goal-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 8px 5px 10px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:500;
    border:1px solid var(--line);
  }
  .goal-chip.p1{background:var(--teal-soft);color:var(--teal);}
  .goal-chip.p2{background:var(--brick-soft);color:var(--brick);}
  .goal-chip-remove{
    background:none;
    color:inherit;
    opacity:.65;
    font-size:11px;
    padding:0;
    line-height:1;
  }
  .goal-chip-remove:hover{opacity:1;}
  .goal-add-row{
    display:flex;
    gap:8px;
  }
  .goal-add-row input{flex:1;}
  .goal-add-btn{
    background:var(--bg);
    color:var(--muted);
    border:1px solid var(--line);
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
  }
  .goal-add-btn:hover{border-color:var(--teal);color:var(--teal);}
  .photo-pick-btn{
    background:var(--bg);
    color:var(--muted);
    border:1px solid var(--line);
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
  }
  .photo-pick-btn:hover{border-color:var(--teal);color:var(--teal);}
  input[type=file]{display:none;}
  .photo-hint{font-size:12.5px;color:var(--muted);}
  .avatar-preview-wrap{
    position:relative;
    width:90px;height:90px;
    flex:0 0 auto;
  }
  .avatar-preview-wrap .person-avatar{
    width:90px;height:90px;
    font-size:33px;
  }
  .photo-remove{
    position:absolute;top:-7px;right:-7px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--brick);color:#0B0C0A;
    font-size:11px;line-height:18px;
    text-align:center;padding:0;
  }
  .field{margin-bottom:10px;}
  .field label{
    display:block;font-size:12px;color:var(--muted);margin-bottom:4px;
  }
  input[type=text], input[type=number], input[type=date]{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:var(--bg);
    color:var(--ink);
  }
  input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .save-settings{
    background:var(--teal);color:#0B0C0A;padding:8px 14px;
    border-radius:8px;font-size:13.5px;margin-top:4px;font-weight:600;
  }
  .save-settings:hover{background:var(--gold);}
  .save-settings:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}

  /* --- Formulario --- */
  .form-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 14px 0;
  }
  .form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  .person-select{
    display:flex;gap:8px;
  }
  .person-pick{
    flex:1;
    padding:9px 8px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:var(--surface);
    color:var(--muted);
    font-size:13.5px;
    font-weight:500;
    text-align:center;
    transition:.15s;
  }
  .person-pick.active.p1{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);}
  .person-pick.active.p2{border-color:var(--brick);background:var(--brick-soft);color:var(--brick);}
  .add-btn{
    background:var(--teal);color:#0B0C0A;
    padding:10px 18px;border-radius:9px;
    font-size:14.5px;font-weight:600;
    margin-top:4px;
  }
  .add-btn:hover{background:var(--gold);}
  .add-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}

  /* --- Historial --- */
  .history-card{margin-top:20px;}
  .history-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;
  }
  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .dot{flex:0 0 auto;width:9px;height:9px;}
  .entry-who{flex:0 0 auto;font-size:13.5px;font-weight:500;width:70px;}
  .entry-date{flex:0 0 auto;color:var(--muted);font-size:12.5px;width:150px;}
  .entry-note{flex:1;color:var(--muted);font-size:13px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry-amount{
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;
    flex:0 0 auto;
  }
  .entry-del{
    background:none;color:var(--line);font-size:16px;
    flex:0 0 auto;padding:2px 4px;line-height:1;
  }
  .entry-del:hover{color:var(--brick);}
  .empty-state{
    color:var(--muted);
    font-size:14px;
    padding:20px 0;
    text-align:center;
  }
  .loading{color:var(--muted);font-size:14px;padding:16px 0;}
  @media (max-width:480px){
    .entry-note{display:none;}
    .form-row{grid-template-columns:1fr;}
    .entry-date{width:auto;font-size:11.5px;}
    .entry-who{width:56px;}
  }

  /* --- Gráfica --- */
  .chart-card{margin-top:20px;}
  .chart-legend{
    display:flex;gap:18px;
    font-size:12.5px;color:var(--muted);
    margin-bottom:14px;
  }
  .chart-legend span{display:flex;align-items:center;gap:6px;}
  .chart-svg{width:100%;height:auto;max-height:160px;display:block;}
  .chart-month-label{
    fill:var(--muted);
    font-size:10.5px;
    font-family:'Inter',sans-serif;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="pageTitle">Ahorro en pareja</h1>
      <p class="subhead" id="pageSubhead">Cargando...</p>
    </div>
    <button class="icon-btn" id="resetBtn" title="Borrar todos los datos">Reiniciar datos</button>
  </header>
  <p class="status-line" id="statusLine"></p>

  <div class="grid">

    <!-- RESUMEN -->
    <div class="card" id="resumenCard">
      <div class="loading">Cargando resumen...</div>
    </div>

    <!-- FORMULARIO + HISTORIAL -->
    <div>
      <div class="card">
        <p class="form-title">Registrar ahorro</p>
        <div class="field">
          <label>¿Quién ahorró?</label>
          <div class="person-select" id="personSelect">
            <button type="button" class="person-pick p1" data-p="1"></button>
            <button type="button" class="person-pick p2" data-p="2"></button>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Cantidad</label>
            <input type="number" id="amountInput" placeholder="0" min="0" step="1">
          </div>
          <div class="field">
            <label>Fecha</label>
            <input type="date" id="dateInput">
          </div>
        </div>
        <div class="field">
          <label>Nota (opcional)</label>
          <input type="text" id="noteInput" placeholder="Ej. quincena, propina, extra...">
        </div>
        <button class="add-btn" id="addBtn">Agregar registro</button>
      </div>

      <div class="card history-card">
        <div class="history-head">
          <p class="form-title" style="margin:0;">Historial</p>
          <span class="subhead" id="countLabel"></span>
        </div>
        <div id="historyList">
          <div class="loading">Cargando historial...</div>
        </div>
      </div>

      <div class="card chart-card">
        <p class="form-title">Ahorro por mes</p>
        <div id="chartArea"></div>
      </div>
    </div>

  </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN DE JSONBIN.IO
   Rellena estos dos valores con los que te da tu cuenta:
   ========================================================= */
const JSONBIN_BIN_ID = '6a95e29af5f4af5e29596629';
const JSONBIN_MASTER_KEY = '$2a$10$0F7DfN4Nr14Hd6n0vAf5hu114cujRy4hydn4w8CtacFgEPu9pqT16';
/* ========================================================= */

const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

let state = {
  settings: { name1: 'Pablo', name2: 'Eli', goals1: [{name:'', amount:4000}], goals2: [{name:'', amount:4000}] },
  entries: []
};
let selectedPerson = 1;
let saving = false;

const fmt = (n) => '$' + Math.round(Number(n) || 0).toLocaleString('es-MX');
const fmtDate = (iso) => {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-MX', {day:'numeric', month:'long', year:'numeric'});
};

let pendingAvatar1 = undefined; // undefined = sin cambios, null = quitar, string = nueva foto
let pendingAvatar2 = undefined;

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Imagen inválida'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          if (width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function avatarHtml(src, name, cls){
  if (src){
    return `<img class="person-avatar ${cls}" src="${src}" alt="${name || ''}">`;
  }
  const initial = (name || '?').trim().charAt(0).toUpperCase();
  return `<span class="person-avatar person-avatar-fallback ${cls}">${initial}</span>`;
}

function setStatus(text, isError){
  const el = document.getElementById('statusLine');
  el.textContent = text || '';
  el.classList.toggle('error', !!isError);
}

function migrateSettings(){
  const s = state.settings;
  if (!Array.isArray(s.goals1)){
    s.goals1 = s.goal1 ? [Number(s.goal1)] : [];
  }
  if (!Array.isArray(s.goals2)){
    s.goals2 = s.goal2 ? [Number(s.goal2)] : [];
  }
  s.goals1 = s.goals1.map(g => (typeof g === 'object' && g !== null) ? g : { name:'', amount:Number(g) });
  s.goals2 = s.goals2.map(g => (typeof g === 'object' && g !== null) ? g : { name:'', amount:Number(g) });
}

function nextGoalInfo(goalsArr, total){
  const sorted = (goalsArr || [])
    .filter(g => g && Number(g.amount) > 0)
    .map(g => ({ name: g.name || '', amount: Number(g.amount) }))
    .sort((a,b)=>a.amount-b.amount);
  if (!sorted.length) return { next: null, allDone: false, sorted, doneCount: 0 };
  const doneCount = sorted.filter(g => total >= g.amount).length;
  const next = sorted.find(g => g.amount > total);
  if (next === undefined) return { next: sorted[sorted.length-1], allDone: true, sorted, doneCount };
  return { next, allDone: false, sorted, doneCount };
}

async function loadAll(){
  try {
    setStatus('Cargando datos...');
    const res = await fetch(JSONBIN_BASE + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json && json.record && json.record.settings){
      state = json.record;
    }
    migrateSettings();
    setStatus('');
  } catch(e) {
    console.error('No se pudo cargar', e);
    setStatus('No se pudo conectar con el guardado en la nube. Revisa tu conexión y recarga la página.', true);
  }
  render();
}

async function persistAll(){
  saving = true;
  updateSaveButtons();
  try {
    setStatus('Guardando...');
    const res = await fetch(JSONBIN_BASE, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_MASTER_KEY
      },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setStatus('');
  } catch(e) {
    console.error('No se pudo guardar', e);
    setStatus('No se pudo guardar el cambio. Revisa tu conexión e inténtalo de nuevo.', true);
  }
  saving = false;
  updateSaveButtons();
}

function updateSaveButtons(){
  const addBtn = document.getElementById('addBtn');
  if (addBtn) addBtn.disabled = saving;
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  if (saveSettingsBtn) saveSettingsBtn.disabled = saving;
}

function totals(){
  const t1 = state.entries.filter(x=>x.person===1).reduce((a,b)=>a+Number(b.amount),0);
  const t2 = state.entries.filter(x=>x.person===2).reduce((a,b)=>a+Number(b.amount),0);
  return { t1, t2, total: t1+t2 };
}

let pendingGoals1 = null;
let pendingGoals2 = null;

function renderResumen(){
  const settings = state.settings;
  const { t1, t2, total } = totals();
  const info1 = nextGoalInfo(settings.goals1, t1);
  const info2 = nextGoalInfo(settings.goals2, t2);
  const nextAmt1 = info1.next ? info1.next.amount : 0;
  const nextAmt2 = info2.next ? info2.next.amount : 0;
  const combinedNext = nextAmt1 + nextAmt2;
  const pct = combinedNext > 0 ? Math.min(100, (total/combinedNext)*100) : 0;
  const pct1 = nextAmt1 > 0 ? Math.min(100, (t1/nextAmt1)*100) : 0;
  const pct2 = nextAmt2 > 0 ? Math.min(100, (t2/nextAmt2)*100) : 0;

  document.getElementById('pageTitle').textContent =
    (settings.name1 || 'Persona 1') + ' & ' + (settings.name2 || 'Persona 2');
  document.getElementById('pageSubhead').textContent =
    combinedNext > 0 ? 'Meta actual: ' + fmt(combinedNext) : 'Aún no has definido metas';

  const personGoalLine = (info, pct) => {
    if (!info.sorted.length) return 'Sin meta';
    if (info.allDone) return `¡Metas cumplidas! (${info.doneCount}/${info.sorted.length})`;
    const label = info.next.name ? `${info.next.name} (${fmt(info.next.amount)})` : fmt(info.next.amount);
    return `${pct.toFixed(0)}% de ${label} · meta ${info.doneCount+1}/${info.sorted.length}`;
  };

  if (pendingGoals1 === null) pendingGoals1 = [...(settings.goals1 || [])];
  if (pendingGoals2 === null) pendingGoals2 = [...(settings.goals2 || [])];

  const card = document.getElementById('resumenCard');
  card.innerHTML = `
    <div class="hero-label">Total ahorrado</div>
    <div class="hero-total">${fmt(total)}</div>
    <div class="goal-line">
      <span>${combinedNext>0 ? pct.toFixed(0)+'% de la meta actual' : 'Sin meta definida'}</span>
      <strong>${combinedNext>0 ? fmt(combinedNext) : ''}</strong>
    </div>
    <div class="track"><div class="track-fill" style="width:${pct}%"></div></div>

    <div class="persons">
      <div class="person-card p1">
        <div class="person-name">
          ${avatarHtml(settings.avatar1, settings.name1, 'p1')}
          ${settings.name1 || 'Persona 1'}
        </div>
        <div class="person-amount">${fmt(t1)}</div>
        <div class="person-goal-line">${personGoalLine(info1, pct1)}</div>
        <div class="mini-track"><div class="mini-track-fill p1" style="width:${pct1}%"></div></div>
      </div>
      <div class="person-card p2">
        <div class="person-name">
          ${avatarHtml(settings.avatar2, settings.name2, 'p2')}
          ${settings.name2 || 'Persona 2'}
        </div>
        <div class="person-amount">${fmt(t2)}</div>
        <div class="person-goal-line">${personGoalLine(info2, pct2)}</div>
        <div class="mini-track"><div class="mini-track-fill p2" style="width:${pct2}%"></div></div>
      </div>
    </div>

    <div class="settings-toggle">
      <button type="button" id="toggleSettings">Editar nombres, metas y foto</button>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <div class="person-settings-block">
        <div class="field">
          <label>Nombre persona 1</label>
          <input type="text" id="name1Input" value="${settings.name1 || ''}">
        </div>
        <div class="field">
          <label>Metas de ${settings.name1 || 'persona 1'} (nombre y monto, en el orden que las quieran ir cumpliendo)</label>
          <div class="goals-field" id="goalsField1"></div>
        </div>
        <div class="field">
          <label>Foto de ${settings.name1 || 'persona 1'}</label>
          <div class="avatar-field" id="avatarField1"></div>
        </div>
      </div>
      <div class="person-settings-block">
        <div class="field">
          <label>Nombre persona 2</label>
          <input type="text" id="name2Input" value="${settings.name2 || ''}">
        </div>
        <div class="field">
          <label>Metas de ${settings.name2 || 'persona 2'} (nombre y monto, en el orden que las quieran ir cumpliendo)</label>
          <div class="goals-field" id="goalsField2"></div>
        </div>
        <div class="field">
          <label>Foto de ${settings.name2 || 'persona 2'}</label>
          <div class="avatar-field" id="avatarField2"></div>
        </div>
      </div>
      <button class="save-settings" id="saveSettingsBtn">Guardar</button>
    </div>
  `;

  renderAvatarField(1);
  renderAvatarField(2);
  renderGoalsField(1);
  renderGoalsField(2);

  document.getElementById('toggleSettings').addEventListener('click', ()=>{
    document.getElementById('settingsPanel').classList.toggle('open');
  });
  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    state.settings.name1 = document.getElementById('name1Input').value.trim() || 'Persona 1';
    state.settings.name2 = document.getElementById('name2Input').value.trim() || 'Persona 2';
    state.settings.goals1 = [...pendingGoals1].filter(g=>Number(g.amount)>0).sort((a,b)=>a.amount-b.amount);
    state.settings.goals2 = [...pendingGoals2].filter(g=>Number(g.amount)>0).sort((a,b)=>a.amount-b.amount);
    if (pendingAvatar1 !== undefined) state.settings.avatar1 = pendingAvatar1;
    if (pendingAvatar2 !== undefined) state.settings.avatar2 = pendingAvatar2;
    pendingAvatar1 = undefined;
    pendingAvatar2 = undefined;
    pendingGoals1 = null;
    pendingGoals2 = null;
    await persistAll();
    render();
  });
}

function renderGoalsField(n){
  const list = n===1 ? pendingGoals1 : pendingGoals2;
  const cls = n===1 ? 'p1' : 'p2';
  const field = document.getElementById('goalsField' + n);
  if (!field) return;

  const sorted = [...list].filter(g=>Number(g.amount)>0).sort((a,b)=>a.amount-b.amount);
  const chips = sorted.map((g) => `
    <span class="goal-chip ${cls}">
      ${g.name ? g.name + ' · ' : ''}${fmt(g.amount)}
      <button type="button" class="goal-chip-remove" data-n="${n}" data-val="${g.amount}" data-name="${(g.name||'').replace(/"/g,'&quot;')}" title="Quitar">✕</button>
    </span>
  `).join('') || '<span class="photo-hint">Sin metas todavía</span>';

  field.innerHTML = `
    <div class="goal-chips">${chips}</div>
    <div class="goal-add-row">
      <input type="text" id="goalNameInput${n}" placeholder="Nombre (opcional)">
      <input type="number" id="goalNewInput${n}" placeholder="Monto" min="0" step="1">
      <button type="button" class="goal-add-btn" id="goalAddBtn${n}">Agregar</button>
    </div>
  `;

  field.querySelectorAll('.goal-chip-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = Number(btn.dataset.val);
      const name = btn.dataset.name || '';
      const arr = n===1 ? pendingGoals1 : pendingGoals2;
      const idx = arr.findIndex(g => Number(g.amount)===val && (g.name||'')===name);
      if (idx > -1) arr.splice(idx, 1);
      renderGoalsField(n);
    });
  });

  document.getElementById('goalAddBtn' + n).addEventListener('click', ()=>{
    const nameInput = document.getElementById('goalNameInput' + n);
    const amountInput = document.getElementById('goalNewInput' + n);
    const val = parseFloat(amountInput.value);
    if (!val || val <= 0) { amountInput.focus(); return; }
    const arr = n===1 ? pendingGoals1 : pendingGoals2;
    arr.push({ name: nameInput.value.trim(), amount: val });
    nameInput.value = '';
    amountInput.value = '';
    renderGoalsField(n);
  });
}

function renderAvatarField(n){
  const settings = state.settings;
  const current = n===1
    ? (pendingAvatar1 !== undefined ? pendingAvatar1 : settings.avatar1)
    : (pendingAvatar2 !== undefined ? pendingAvatar2 : settings.avatar2);
  const name = n===1 ? settings.name1 : settings.name2;
  const cls = n===1 ? 'p1' : 'p2';
  const field = document.getElementById('avatarField' + n);
  if (!field) return;

  if (current){
    field.innerHTML = `
      <div class="avatar-preview-wrap">
        ${avatarHtml(current, name, cls)}
        <button type="button" class="photo-remove" id="avatarRemove${n}" title="Quitar foto">✕</button>
      </div>
      <span class="photo-hint">Foto lista</span>
    `;
    document.getElementById('avatarRemove' + n).addEventListener('click', ()=>{
      if (n===1) pendingAvatar1 = null; else pendingAvatar2 = null;
      renderAvatarField(n);
    });
  } else {
    field.innerHTML = `
      <button type="button" class="photo-pick-btn" id="avatarPick${n}">Elegir foto</button>
      <input type="file" id="avatarInput${n}" accept="image/*">
      <span class="photo-hint">Sin foto</span>
    `;
    document.getElementById('avatarPick' + n).addEventListener('click', ()=>{
      document.getElementById('avatarInput' + n).click();
    });
    document.getElementById('avatarInput' + n).addEventListener('change', async (ev)=>{
      const file = ev.target.files[0];
      if (!file) return;
      const hint = field.querySelector('.photo-hint');
      hint.textContent = 'Procesando imagen...';
      try {
        const dataUrl = await resizeImageFile(file, 200, 0.7);
        if (n===1) pendingAvatar1 = dataUrl; else pendingAvatar2 = dataUrl;
        renderAvatarField(n);
      } catch(err){
        hint.textContent = 'No se pudo cargar la foto, intenta otra';
      }
    });
  }
}

function renderPersonPicker(){
  const settings = state.settings;
  const p1btn = document.querySelector('.person-pick.p1');
  const p2btn = document.querySelector('.person-pick.p2');
  p1btn.textContent = settings.name1 || 'Persona 1';
  p2btn.textContent = settings.name2 || 'Persona 2';
  p1btn.classList.toggle('active', selectedPerson===1);
  p2btn.classList.toggle('active', selectedPerson===2);
}

function renderHistory(){
  const settings = state.settings;
  const entries = state.entries;
  const list = document.getElementById('historyList');
  document.getElementById('countLabel').textContent =
    entries.length ? entries.length + (entries.length===1 ? ' registro' : ' registros') : '';

  if (!entries.length){
    list.innerHTML = '<div class="empty-state">Todavía no hay registros. Agrega el primero arriba.</div>';
    return;
  }
  const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
  list.innerHTML = sorted.map(e => `
    <div class="entry">
      <span class="dot ${e.person===1?'p1':'p2'}"></span>
      <span class="entry-who">${e.person===1 ? (settings.name1||'P1') : (settings.name2||'P2')}</span>
      <span class="entry-date">${fmtDate(e.date)}</span>
      <span class="entry-note">${e.note ? e.note : ''}</span>
      <span class="entry-amount">${fmt(e.amount)}</span>
      <button class="entry-del" data-id="${e.id}" title="Eliminar">✕</button>
    </div>
  `).join('');

  list.querySelectorAll('.entry-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.entries = state.entries.filter(x=>String(x.id) !== btn.dataset.id);
      await persistAll();
      render();
    });
  });
}

function renderChart(){
  const settings = state.settings;
  const entries = state.entries;
  const area = document.getElementById('chartArea');

  if (!entries.length){
    area.innerHTML = '<div class="empty-state">Aún no hay datos suficientes para graficar.</div>';
    return;
  }

  const map = {};
  entries.forEach(e=>{
    const key = e.date.slice(0,7);
    if (!map[key]) map[key] = { t1:0, t2:0 };
    if (e.person===1) map[key].t1 += Number(e.amount);
    else map[key].t2 += Number(e.amount);
  });

  const keys = Object.keys(map).sort();
  const shown = keys.slice(-6);
  const maxVal = Math.max(1, ...shown.map(k => Math.max(map[k].t1, map[k].t2)));

  const barW = 12, gap = 7, groupGap = 18, chartH = 80, leftPad = 10, topPad = 8;
  const groupW = barW*2 + gap;
  const totalW = shown.length*groupW + Math.max(0, shown.length-1)*groupGap + leftPad*2;

  const monthLabel = (key) => {
    const [y, m] = key.split('-');
    const d = new Date(Number(y), Number(m)-1, 1);
    const label = d.toLocaleDateString('es-MX', { month:'short' });
    return label.charAt(0).toUpperCase() + label.slice(1).replace('.','');
  };

  let bars = '';
  shown.forEach((key, i) => {
    const x = leftPad + i*(groupW+groupGap);
    const h1 = (map[key].t1/maxVal)*chartH;
    const h2 = (map[key].t2/maxVal)*chartH;
    bars += `
      <rect x="${x}" y="${topPad+chartH-h1}" width="${barW}" height="${Math.max(h1,1)}" rx="3" fill="var(--teal)"></rect>
      <rect x="${x+barW+gap}" y="${topPad+chartH-h2}" width="${barW}" height="${Math.max(h2,1)}" rx="3" fill="var(--brick)"></rect>
      <text x="${x+barW+gap/2}" y="${topPad+chartH+18}" text-anchor="middle" class="chart-month-label">${monthLabel(key)}</text>
    `;
  });

  area.innerHTML = `
    <div class="chart-legend">
      <span><span class="dot p1"></span>${settings.name1 || 'P1'}</span>
      <span><span class="dot p2"></span>${settings.name2 || 'P2'}</span>
    </div>
    <svg viewBox="0 0 ${totalW} ${chartH+topPad+30}" class="chart-svg" preserveAspectRatio="xMinYMid meet">
      ${bars}
    </svg>
  `;
}

function render(){
  renderResumen();
  renderPersonPicker();
  renderHistory();
  renderChart();
  updateSaveButtons();
}

document.getElementById('personSelect').addEventListener('click', (ev)=>{
  const btn = ev.target.closest('.person-pick');
  if (!btn) return;
  selectedPerson = Number(btn.dataset.p);
  renderPersonPicker();
});

document.getElementById('dateInput').valueAsDate = new Date();

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const amount = parseFloat(document.getElementById('amountInput').value);
  const date = document.getElementById('dateInput').value;
  const note = document.getElementById('noteInput').value.trim();

  if (!amount || amount <= 0){
    document.getElementById('amountInput').focus();
    return;
  }
  if (!date){
    document.getElementById('dateInput').focus();
    return;
  }

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    person: selectedPerson,
    amount: amount,
    date: date,
    note: note
  };
  state.entries.push(entry);
  await persistAll();

  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  render();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if (!confirm('Esto borrará todos los registros y la configuración para ambos. ¿Continuar?')) return;
  state = {
    settings: { name1: 'Pablo', name2: 'Eli', goals1: [{name:'', amount:4000}], goals2: [{name:'', amount:4000}] },
    entries: []
  };
  pendingGoals1 = null;
  pendingGoals2 = null;
  pendingAvatar1 = undefined;
  pendingAvatar2 = undefined;
  await persistAll();
  render();
});

loadAll();
</script>
